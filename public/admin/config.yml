          - { name: titre, label: Grand titre, widget: string }
          - { name: accroche, label: Phrase sous le titre, widget: string, required: false }
          - { name: sous_titres, label: Phrases d'introduction, widget: list, field: { name: ligne, label: Phrase, widget: text } }
          - { name: bouton, label: Texte du bouton, widget: string }
