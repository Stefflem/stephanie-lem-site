# Réglages de construction, lus automatiquement par Netlify à l'import du dépôt.
# Rien à saisir à la main dans l'interface.

[build]
  # ⚠️ Le `rm` n'est pas décoratif. Netlify garde node_modules d'une
  # construction à l'autre, et Astro y range son index de contenu
  # (node_modules/.astro/data-store.json). Cet index ne voit pas les
  # suppressions : sans ce vidage, une page que Stéphanie supprime depuis son
  # espace reste en ligne. Vérifié le 2026-09-20, le cas se reproduit à
  # l'identique. Le vidage coûte moins d'une seconde.
  command = "rm -rf node_modules/.astro && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Les en têtes vivent dans public/_headers, une seule source de vérité.
# Ne rien redéclarer ici : Netlify appliquerait les deux et c'est illisible.

# ==========================================================================
# Livraison protégée des fichiers payants
# ==========================================================================
# Les fichiers vivent dans fichiers-proteges/, hors de dist/, donc ils ne sont
# jamais publiés. Seule la fonction telecharger peut les lire, et seulement
# contre un lien signé non expiré, lui même délivré par la fonction acces
# après vérification du paiement auprès de Stripe.
#
# Variables à poser dans Netlify (Site settings, Environment variables),
# JAMAIS dans ce dépôt :
#   STRIPE_SECRET_KEY    sk_live_…
#   SIGNATURE_SECRET     openssl rand -hex 32
#   STRIPE_PRICE_SOCLE   price_…  (le tarif du Socle)
#   TELEGRAM_INVITE      le lien d'invitation au canal privé (optionnel)

[functions]
  node_bundler = "esbuild"
  included_files = ["fichiers-proteges/**"]

[[redirects]]
  from = "/api/acces"
  to = "/.netlify/functions/acces"
  status = 200

[[redirects]]
  from = "/api/telecharger"
  to = "/.netlify/functions/telecharger"
  status = 200
