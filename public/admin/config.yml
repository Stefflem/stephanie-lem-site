# Connexion de Stéphanie à son espace : compte GitHub.
# (Git Gateway, qui permettait une connexion par e-mail, est déprécié par Netlify
#  depuis 2026 et ne reçoit plus de correctifs : on ne construit pas dessus.)
# ⚠️ REMPLACER `repo` par le dépôt de Stéphanie après le transfert :
#    <son-compte-github>/stephanie-lem-site
backend:
  name: github
  repo: Tino24908/stephanie-lem-site
  branch: main
  commit_messages:
    create: "Nouveau : {{slug}}"
    update: "Modification : {{slug}}"
    delete: "Suppression : {{slug}}"
    uploadMedia: "Photo ajoutée : {{path}}"
    deleteMedia: "Photo retirée : {{path}}"

site_url: https://www.stephanielem.fr
display_url: https://www.stephanielem.fr
logo_url: /images/logo.png
locale: fr

media_folder: public/images
public_folder: /images

editor:
  preview: false

collections:
  - name: blog
    label: Articles du blog
    label_singular: Article
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    sort: "date:asc"
    summary: "{{title}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: theme, label: Thème (un mot, affiché au dessus du titre), widget: string, required: false, hint: "Par exemple Vision, Lieu, Budget" }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "Les articles s'affichent du plus ancien au plus récent" }
      - { name: description, label: Résumé (pour Google et les partages, 150 caractères), widget: text, required: false }
      - { name: image, label: Photo de l'article, widget: image, required: false, hint: "Affichée dans la rubrique Prochainement" }
      - { name: draft, label: Brouillon (affiché dans « Prochainement », pas encore lisible), widget: boolean, default: true }
      - { name: body, label: Texte de l'article, widget: markdown, hint: "Les sous titres se font avec « Titre 2 »" }

  - name: projets
    label: Projets en cours
    label_singular: Projet
    folder: src/content/projets
    create: true
    slug: "{{ordre}}-{{lieu}}"
    sort: "ordre:asc"
    summary: "{{lieu}} · {{avec}}"
    fields:
      - { name: lieu, label: Lieu (titre de la carte), widget: string }
      - { name: sous_titre, label: Petit texte au dessus (région, île, pays), widget: string, required: false }
      - { name: avec, label: Avec qui, widget: string, required: false, hint: "Par exemple : Avec Aya, entrepreneuse" }
      - { name: image, label: Photo, widget: image }
      - { name: ordre, label: Ordre d'affichage, widget: number, value_type: int, default: 1 }
      - { name: body, label: Description, widget: markdown }

  - name: vente
    label: Pages de vente
    files:
      - name: lesocle
        label: Le Socle
        file: src/content/vente/lesocle.md
        fields:
          - { name: surtitre, label: Petite ligne au dessus du titre, widget: string, required: false }
          - { name: titre, label: Grand titre, widget: string }
          - { name: accroche, label: Phrase sous le titre, widget: string, required: false }
          - { name: sous_titres, label: Phrases d'introduction, widget: list, field: { name: ligne, label: Phrase, widget: text } }
          - { name: bouton, label: Texte du bouton, widget: string }
          - { name: rassurance, label: Petite phrase sous le bouton, widget: string, required: false }
          - { name: banniere, label: Bannière de tête, widget: image, required: false }
          - { name: visuel_ensemble, label: Visuel d'ensemble, widget: image, required: false, hint: "Les guides et les audios réunis, près du prix" }
          - name: visuels
            label: Les visuels du produit
            widget: list
            fields:
              - { name: image, label: Image, widget: image }
              - { name: legende, label: Légende sous l'image, widget: string, required: false }
          - { name: recois_titre, label: "Titre du bloc « ce que tu reçois »", widget: string, required: false }
          - { name: recois, label: Ce que tu reçois, widget: list, field: { name: ligne, label: Ligne, widget: string } }
          - { name: prix_titre, label: Titre du bloc prix, widget: string, required: false }
          - { name: prix_mentions, label: Phrases autour du prix, widget: list, field: { name: ligne, label: Phrase, widget: text } }
          - { name: inclus_titre, label: Titre de la liste de ce qui est inclus, widget: string, required: false }
          - { name: inclus, label: Ce qui est inclus, widget: list, field: { name: ligne, label: Ligne, widget: string } }
          - name: faq
            label: Questions fréquentes
            widget: list
            fields:
              - { name: q, label: Question, widget: string }
              - { name: r, label: Réponse, widget: text }
          - { name: final_titre, label: Titre du bloc final, widget: string, required: false }
          - { name: final_sous, label: Phrase du bloc final, widget: text, required: false }
          - { name: final_rassurance, label: Phrase de réassurance, widget: string, required: false }
          - { name: contact_texte, label: Phrase avant l'adresse e-mail, widget: text, required: false }
          - { name: seo_description, label: Description pour Google, widget: text, required: false }
          - { name: body, label: Le corps de la page, widget: markdown, hint: "« Titre 2 » ouvre une section, « Titre 3 » crée un encadré" }
      - name: guideoffert
        label: Guide offert, Déclic Immersif
