# Réglages de construction, lus automatiquement par Netlify à l'import du dépôt.
# Rien à saisir à la main dans l'interface.

[build]
  # ⚠️ Le `rm` n'est pas décoratif. Netlify garde node_modules d'une
  # construction à l'autre, et Astro y range son index de contenu
  # (node_modules/.astro/data-store.json). Cet index ne voit pas les
  # suppressions : sans ce vidage, une page que Stéphanie supprime depuis son
  # espace reste en ligne. Vérifié le 2026-09-20, le cas se reproduit à
  # l'identique. Le vidage coûte moins d'une seconde.
  command = "rm -rf node_modules/.astro && npm run build"
  publish = "dist"
  # ⚠️ Le plan gratuit fonctionne a credits mensuels, et chaque construction en
  # consomme. Le 2026-09-23, douze deploiements en une journee ont vide le mois
  # (periode du 10 au 9), production bloquee jusqu au 9 octobre. Cette regle
  # ignore les commits qui ne touchent que de la documentation : la
  # construction n a lieu que si un fichier utile au site a change.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude)LICENSE'"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Les en têtes vivent dans public/_headers, une seule source de vérité.
# Ne rien redéclarer ici : Netlify appliquerait les deux et c'est illisible.

# ==========================================================================
# Livraison protégée des fichiers payants
# ==========================================================================
# Les fichiers vivent dans un coffre Netlify Blobs nommé « fichiers-proteges »,
# jamais dans ce dépôt (il est public). Seule la fonction telecharger peut les
# lire, et seulement contre un lien signé non expiré, lui même délivré par la
# fonction acces après vérification du paiement auprès de Stripe.
# Dépôt d'un fichier dans le coffre : voir PAIEMENT-ET-MAILS.md, section Blobs.
#
# Variables à poser dans Netlify (Site settings, Environment variables),
# JAMAIS dans ce dépôt :
#   STRIPE_SECRET_KEY    rk_live_…  cle RESTREINTE, lecture seule des sessions de paiement
#   SIGNATURE_SECRET     openssl rand -hex 32
#   STRIPE_PRICE_SOCLE     price_…  tarif du Socle
#   STRIPE_PRICE_DEEPDRIVE price_…  tarif de Deep Drive
#   WHATSAPP_SOCLE         son numéro WhatsApp en chiffres seuls, 33…, remis avec Le Socle en lien wa.me
#   CALENDLY_DEEPDRIVE     lien de réservation (remis après un Deep Drive payé)
#
# Passerelle Brevo (fonction submission-created, appelée par Netlify à chaque
# formulaire envoyé). Sans ces variables, les formulaires continuent d'arriver
# dans Netlify et par mail : Brevo est un plus, jamais un passage obligé.
#   BREVO_API_KEY        la clé API v3 de son compte Brevo
#   BREVO_LISTE_GUIDE    identifiant de la liste « guide offert »
#   BREVO_LISTE_CONTACT  identifiant de la liste « demandes de contact »
#   BREVO_LISTE_WEBINAIRE identifiant de la liste « étude de cas »

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/acces"
  to = "/.netlify/functions/acces"
  status = 200

[[redirects]]
  from = "/api/pilotage"
  to = "/.netlify/functions/pilotage"
  status = 200

[[redirects]]
  from = "/api/telecharger"
  to = "/.netlify/functions/telecharger"
  status = 200
