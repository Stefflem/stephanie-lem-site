          - { name: image, label: Visuel de partage, widget: image, required: false }
          - { name: final_titre, label: Titre du formulaire, widget: string, required: false }
          - { name: final_sous, label: Phrase du formulaire, widget: text, required: false }
          - { name: final_rassurance, label: Phrase sous le formulaire, widget: string, required: false }
          - { name: seo_description, label: Description pour Google, widget: text, required: false }
          - { name: body, label: Le corps de la page, widget: markdown }
