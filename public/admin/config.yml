# Connexion de Stéphanie à son espace : compte GitHub.
# (Git Gateway, qui permettait une connexion par e-mail, est déprécié par Netlify
#  depuis 2026 et ne reçoit plus de correctifs : on ne construit pas dessus.)
# ✅ Dépôt transféré chez elle le 2026-09-20 : Stefflem/stephanie-lem-site
# ⚠️ Son identifiant GitHub est bien `Stefflem`, compte créé le 2026-09-10.
#    Ce n'est PAS `Ste2fLem`, qui n'existe pas, ni `stephanielem` ni `steflem`,
#    qui appartiennent à d'autres personnes.
backend:
  name: github
  repo: Stefflem/stephanie-lem-site
  branch: main
  commit_messages:
    create: "Nouveau : {{slug}}"
    update: "Modification : {{slug}}"
    delete: "Suppression : {{slug}}"
    uploadMedia: "Photo ajoutée : {{path}}"
    deleteMedia: "Photo retirée : {{path}}"

# ⚠️ Adresse provisoire, le temps que le domaine bascule sur Netlify.
# Tant que www.stephanielem.fr pointe sur systeme.io, il renvoie une 404 :
# Stéphanie cliquerait sur le lien de son espace et tomberait sur une page
# cassée. À repasser sur https://www.stephanielem.fr LE JOUR de la bascule.
site_url: https://stephanie-lem.netlify.app
display_url: https://stephanie-lem.netlify.app
logo_url: /images/logo.png
locale: fr

media_folder: public/images
public_folder: /images

editor:
  preview: false

collections:
  - name: blog
    label: Articles du blog
    label_singular: Article
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    sort: "date:asc"
    summary: "{{title}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: theme, label: Thème (un mot, affiché au dessus du titre), widget: string, required: false, hint: "Par exemple Vision, Lieu, Budget" }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "Les articles s'affichent du plus ancien au plus récent" }
      - { name: seo_titre, label: "Titre affiché dans Google", widget: string, required: false, hint: "50 à 60 caractères. Laisse vide pour reprendre le titre de la page. Sert à parler à Google sans déformer ton texte." }
      - { name: description, label: Résumé (pour Google et les partages, 150 caractères), widget: text, required: false }
      - { name: image, label: Photo de l'article, widget: image, required: false, hint: "Affichée dans la rubrique Prochainement" }
      - { name: draft, label: Brouillon (affiché dans « Prochainement », pas encore lisible), widget: boolean, default: true }
      - { name: body, label: Texte de l'article, widget: markdown, hint: "Les sous titres se font avec « Titre 2 »" }

  - name: projets
    label: Projets en cours
    label_singular: Projet
    folder: src/content/projets
    create: true
    slug: "{{ordre}}-{{lieu}}"
    sort: "ordre:asc"
    summary: "{{lieu}} · {{avec}}"
    fields:
      - { name: lieu, label: Lieu (titre de la carte), widget: string }
      - { name: sous_titre, label: Petit texte au dessus (région, île, pays), widget: string, required: false }
      - { name: avec, label: Avec qui, widget: string, required: false, hint: "Par exemple : Avec Aya, entrepreneuse" }
      - { name: image, label: Photo, widget: image }
      - { name: ordre, label: Ordre d'affichage, widget: number, value_type: int, default: 1 }
      - { name: body, label: Description, widget: markdown }

  - name: libres
    label: Pages que je crée
    label_singular: Page
    folder: src/content/libres
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    description: >-
      Crée ici autant de pages que tu veux. Le titre donne l'adresse de la page :
      « Mes témoignages » donne stephanielem.fr/mes-temoignages. Coche « Afficher
      dans le menu » pour qu'elle apparaisse en haut du site.
      ⚠️ N'utilise pas un titre qui donnerait la même adresse qu'une page existante
      (Contact, Projets, À propos, Blog, Le Socle...), la page serait ignorée.
    fields:
      - { name: title, label: Titre de la page, widget: string, hint: "C'est lui qui donne l'adresse de la page" }
      - { name: eyebrow, label: Petite ligne au dessus du titre, widget: string, required: false, hint: "Par exemple : Elles l'ont fait" }
      - { name: chapo, label: Phrase d'introduction, widget: text, required: false }
      - { name: image, label: Image en haut de page, widget: image, required: false }
      - { name: dans_le_menu, label: Afficher dans le menu du site, widget: boolean, default: false }
      - { name: ordre, label: Position dans le menu, widget: number, default: 50, required: false, hint: "Plus le nombre est petit, plus la page est à gauche. Contact reste toujours en dernier." }
      - { name: body, label: Le texte de la page, widget: markdown }
      - { name: bouton_texte, label: "BOUTON · texte", widget: string, required: false, hint: "Laisse vide si la page n'a pas de bouton" }
      - { name: bouton_lien, label: "BOUTON · où il mène", widget: string, required: false, hint: "Une adresse de ton site comme /lesocle/, ou un lien de paiement Stripe" }
      - { name: prix, label: "BOUTON · prix affiché au dessus", widget: string, required: false }
      - { name: rassurance, label: "BOUTON · petite phrase en dessous", widget: string, required: false }
      - { name: noindex, label: Cacher cette page de Google, widget: boolean, default: false }
      - { name: seo_titre, label: "Titre affiché dans Google", widget: string, required: false, hint: "50 à 60 caractères. Laisse vide pour reprendre le titre de la page. Sert à parler à Google sans déformer ton texte." }
      - { name: seo_description, label: Description pour Google, widget: text, required: false }

  - name: boutique
    label: Boutique et livraison
    files:
      - name: vente
        label: Prix, paiement et fichiers
        file: src/content/reglages/vente.md
        description: >-
          Tes prix et tes liens de paiement. Tu les changes ici, le site se met
          à jour tout seul en une à deux minutes.
          ⚠️ Les quatre fichiers du Socle et l'invitation Telegram ne sont pas
          ici : ils ne sont remis qu'après un paiement vérifié, par un lien
          personnel qui expire au bout de 24 heures. Un lien posé sur cette page
          serait un lien public, donc un produit payant qui ne l'est plus.
          Pour remplacer un de ces fichiers, demande à Emmanuel.
        fields:
          - { name: socle_prix, label: "LE SOCLE · prix affiché", widget: string, hint: "Par exemple 111 €" }
          - { name: socle_prix_barre, label: "LE SOCLE · ancien prix barré", widget: string, required: false, hint: "Laisse vide pour ne rien barrer" }
          - { name: socle_lien_paiement, label: "LE SOCLE · lien de paiement Stripe", widget: string, required: false, hint: "Colle ici le lien de paiement créé dans Stripe. Tant qu'il est vide, le bouton renvoie vers un e-mail." }
          - { name: socle_fin_promo, label: "LE SOCLE · fin du prix de lancement", widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "DD/MM/YYYY", time_format: "HH:mm", required: false, hint: "Le compte à rebours n'apparaît que si tu poses une vraie date. Laisse vide sinon : un compte à rebours qui repart à chaque visite se voit et abîme la confiance." }
          - { name: deepdrive_prix, label: "DEEP DRIVE · prix affiché", widget: string, required: false, hint: "Par exemple 200 €. Vide = aucun prix sur la page." }
          - { name: deepdrive_lien_paiement, label: "DEEP DRIVE · lien de paiement Stripe", widget: string, required: false, hint: "Si tu encaisses par Stripe plutôt qu'à la réservation Calendly." }
          - { name: ysaline_prix, label: "LE ROMAN · prix affiché", widget: string, required: false, hint: "Tant qu'il est vide, aucun prix n'apparaît sur la page du roman." }
          - { name: ysaline_lien_paiement, label: "LE ROMAN · lien de paiement Stripe", widget: string, required: false }
          - { name: fichier_guide_offert, label: "FICHIER · guide offert « Déclic immersif »", widget: string, required: false, hint: "Colle ici l'adresse de téléchargement du PDF" }
          - { name: contact, label: "Adresse e-mail affichée en bas des pages de vente", widget: string }

